name: Build NeoForge Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin' # 'zulu' is also widely used for MC dev
        java-version: '21'      # Use '17' if you are building for MC 1.20.1 or below

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      # This action automatically handles smart caching for Gradle dependencies and wrappers

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: neoforge-mod-artifacts
        path: |
          build/libs/*.jar
          !build/libs/*-sources.jar
          !build/libs/*-dev.jar
